name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    name: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '>=3.28'
      - run: cmake --version
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: cargo build --release
      - run: cargo test --release
      - name: test
        run: |
          set -o pipefail
          bash tests/run.sh 2>&1 | tee tests-output.log
      - name: show failures
        if: failure()
        run: |
          grep -n "FAIL" tests-output.log || echo "(none)"
          tail -60 tests-output.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-linux
          path: tests-output.log
          retention-days: 7

  cross-check:
    runs-on: ubuntu-latest
    name: cross-check (windows target)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: cargo check --release --target x86_64-pc-windows-gnu

  macos:
    runs-on: macos-latest
    name: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: test
        run: |
          set -o pipefail
          bash tests/run.sh 2>&1 | tee tests-output.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-macos
          path: tests-output.log
          retention-days: 7

  windows:
    runs-on: windows-latest
    name: windows
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-clang
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '>=3.28'
      - name: rust toolchain (gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          cargo --version
      - run: cmake --version
      - run: cargo build --release
      - run: cargo test --release
      - name: test
        run: |
          set -o pipefail
          bash tests/run.sh 2>&1 | tee tests-output.log
      - name: show failures
        if: failure()
        run: |
          echo "--- failing assertions ---"
          grep -n "FAIL" tests-output.log || echo "(none)"
          echo "--- tail 60 ---"
          tail -60 tests-output.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-windows
          path: tests-output.log
          retention-days: 7
      - name: diagnose
        if: failure()
        run: |
          echo "--- tools ---"
          which gcc cc ar nasm cargo || true
          gcc --version | head -1 || true
          HEDDLE="$GITHUB_WORKSPACE/target/release/heddle.exe"
          echo "HEDDLE=$HEDDLE"
          echo "--- cold build verbose ---"
          cd tests/basic
          rm -rf out .heddle
          "$HEDDLE" -v app; echo "rc=$?"
          echo "--- out ---"
          ls -la out 2>&1 || true
          echo "--- logs ---"
          for f in .heddle/*.log; do echo "== $f"; cat "$f"; done 2>&1 || true
          echo
          echo "=== migrate ==="
          cd "$GITHUB_WORKSPACE/tests/migrate"
          rm -f heddle.toml heddle.star
          rm -rf out .heddle build-heddle-cmake
          echo "--- cmake configure ---"
          cmake --version
          "$HEDDLE" migrate . 2>&1; echo "migrate rc=$?"
          echo "--- heddle.toml ---"
          cat heddle.toml 2>&1 || true
          echo "--- check ---"
          "$HEDDLE" check 2>&1; echo "check rc=$?"
          echo "--- build ---"
          "$HEDDLE" -v app 2>&1; echo "build rc=$?"
          echo "--- graph ---"
          cat .heddle/app.graph 2>&1 || true
          echo "--- compile logs ---"
          for f in .heddle/*.log; do echo "== $f"; cat "$f"; done 2>&1 || true
          echo "--- out ---"
          ls -la out 2>&1 || true
