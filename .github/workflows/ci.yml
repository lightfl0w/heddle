name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '>=3.28'
      - run: cmake --version
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: xmake
      - run: bash tests/run.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xmake
      - run: xmake --version
      - run: xmake

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '>=3.28'
      - run: |
          set -Eeuo pipefail
          cmake --version
      - run: |
          xmake --version || {
            echo "xmake not on PATH; PATH is:"
            echo "$PATH"
            exit 1
          }
      - run: xmake
      - run: bash tests/run.sh
      - name: diagnose
        if: failure()
        run: |
          echo "--- tools ---"
          which gcc cc ar nasm xmake || true
          gcc --version | head -1 || true
          HEDDLE=$(ls "$GITHUB_WORKSPACE"/build/*/*/release/heddle* | head -1)
          echo "HEDDLE=$HEDDLE"
          echo "--- cold build verbose ---"
          cd tests/basic
          rm -rf out .heddle
          "$HEDDLE" -v app; echo "rc=$?"
          echo "--- out ---"
          ls -la out 2>&1 || true
          echo "--- logs ---"
          for f in .heddle/*.log; do echo "== $f"; cat "$f"; done 2>&1 || true
          echo
          echo "=== migrate ==="
          cd "$GITHUB_WORKSPACE/tests/migrate"
          rm -f heddle.toml heddle.star
          rm -rf out .heddle build-heddle-cmake
          echo "--- cmake configure ---"
          cmake --version
          "$HEDDLE" migrate . 2>&1; echo "migrate rc=$?"
          echo "--- heddle.toml ---"
          cat heddle.toml 2>&1 || true
          echo "--- check ---"
          "$HEDDLE" check 2>&1; echo "check rc=$?"
          echo "--- build ---"
          "$HEDDLE" -v app 2>&1; echo "build rc=$?"
          echo "--- graph ---"
          cat .heddle/app.graph 2>&1 || true
          echo "--- compile logs ---"
          for f in .heddle/*.log; do echo "== $f"; cat "$f"; done 2>&1 || true
          echo "--- out ---"
          ls -la out 2>&1 || true