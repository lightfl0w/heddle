name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: xmake
      - run: bash tests/run.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - run: brew install nasm
      - run: xmake
      - run: bash tests/run.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-nasm
      - run: |
          xmake --version || {
            echo "xmake not on PATH; PATH is:"
            echo "$PATH"
            exit 1
          }
      - run: xmake
      - run: bash tests/run.sh
      - name: diagnose
        if: failure()
        run: |
          echo "--- tools ---"
          which gcc cc ar nasm xmake || true
          gcc --version | head -1 || true
          echo "--- cold build verbose ---"
          HEDDLE=$(ls "$GITHUB_WORKSPACE"/build/*/*/release/heddle* | head -1)
          echo "HEDDLE=$HEDDLE"
          cd tests/basic
          rm -rf out .heddle
          "$HEDDLE" -v app; echo "rc=$?"
          echo "--- out ---"
          ls -la out 2>&1 || true
          echo "--- logs ---"
          for f in .heddle/*.log; do echo "== $f"; cat "$f"; done 2>&1 || true
